  <script charset="utf-8" src="https://widgetv3.bandsintown.com/main.min.js"></script>
  <script>
    // Update date display
    function updateDate() {
      const now = new Date();
      const options = {
        month: '2-digit',
        day: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const dateString = now.toLocaleDateString('en-US', options);
      document.getElementById('dateDisplay').textContent = dateString;
    }

    // Update immediately and then every second
    updateDate();
    setInterval(updateDate, 1000);

    // Mark active nav link
    function setActiveNavLink() {
      const currentPage = window.location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav-link').forEach(link => {
        const linkPage = link.getAttribute('href');
        if (linkPage === currentPage || (currentPage === '' && linkPage === 'index.html')) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }
    setActiveNavLink();

    function hmhExtractFirstMatch(text, regex) {
      if (!text) return '';
      const match = text.match(regex);
      return match ? match[0].trim() : '';
    }

    function hmhPickText(el) {
      return el ? (el.textContent || '').trim() : '';
    }

    function hmhFindTicketLink(row) {
      const clickable = Array.from(row.querySelectorAll('a, button'));
      const ticketCandidate = clickable.find(el => /tickets/i.test((el.textContent || '').trim()));
      if (!ticketCandidate) return null;
      if (ticketCandidate.tagName === 'A' && ticketCandidate.getAttribute('href')) return ticketCandidate;
      return ticketCandidate.closest('a[href]') || null;
    }

    function hmhGetEventRows(widgetRoot) {
      return widgetRoot.querySelectorAll(
        '.bit-event, .bit-event-row, .bit-event-item, #bit-events tbody tr, #bit-events tr'
      );
    }

    function hmhDeriveEventFields(row) {
      // Best-effort selectors (widget versions differ).
      const dateEl =
        row.querySelector('.bit-date, [class*="date"]') ||
        row.querySelector('time');
      const venueEl = row.querySelector('.bit-venue, [class*="venue"]');
      const cityEl = row.querySelector('.bit-location, [class*="location"], [class*="city"]');

      const rowText = (row.textContent || '').replace(/\s+/g, ' ').trim();

      // If the widget doesn't expose reliable nodes, fall back to pattern matching.
      const dateText =
        hmhPickText(dateEl) ||
        hmhExtractFirstMatch(rowText, /\b[A-Z][a-z]{2}\.\s?\d{1,2},\s?\d{4}\b/) ||
        hmhExtractFirstMatch(rowText, /\b[A-Z][a-z]{2}\s?\d{1,2},\s?\d{4}\b/) ||
        '';

      const venueText = hmhPickText(venueEl);
      const cityText = hmhPickText(cityEl);

      return { dateText, venueText, cityText };
    }

    function hmhRenderTourDatesFromWidget() {
      const host = document.getElementById('tourDatesList');
      if (!host) return false;

      const widgetContainer = host.querySelector('.bit-widget-container') || host.querySelector('#bit-events');
      if (!widgetContainer) return false;

      const rows = Array.from(hmhGetEventRows(widgetContainer));
      if (rows.length === 0) return false;

      const rendered = document.createElement('div');
      rendered.id = 'hmhTourDatesRendered';
      rendered.className = 'tour-dates-list';

      let added = 0;

      for (const row of rows) {
        const ticketLink = hmhFindTicketLink(row);
        if (!ticketLink) continue;

        const { dateText, venueText, cityText } = hmhDeriveEventFields(row);

        const item = document.createElement('div');
        item.className = 'tour-date-item';

        const info = document.createElement('div');
        info.className = 'tour-date-info';

        if (dateText) {
          const dateSpan = document.createElement('span');
          dateSpan.className = 'tour-date';
          dateSpan.textContent = dateText;
          info.appendChild(dateSpan);
        }

        if (venueText) {
          const venueSpan = document.createElement('span');
          venueSpan.className = 'tour-venue';
          venueSpan.textContent = venueText;
          info.appendChild(venueSpan);
        }

        if (cityText) {
          const citySpan = document.createElement('span');
          citySpan.className = 'tour-city';
          citySpan.textContent = cityText;
          info.appendChild(citySpan);
        }

        const btn = document.createElement('a');
        btn.className = 'tour-link';
        btn.target = '_blank';
        btn.rel = 'noopener noreferrer';
        btn.href = ticketLink.href;
        btn.textContent = 'TICKETS';

        item.appendChild(info);
        item.appendChild(btn);
        rendered.appendChild(item);
        added += 1;
      }

      if (added === 0) return false;

      const existing = host.querySelector('#hmhTourDatesRendered');
      if (existing) existing.remove();

      const initializer = host.querySelector('.bit-widget-initializer');
      if (initializer) initializer.style.display = 'none';

      const widgetWrapper = host.querySelector('.bit-widget-container') || host.querySelector('#bit-events');
      if (widgetWrapper) widgetWrapper.style.display = 'none';

      host.appendChild(rendered);
      return true;
    }

    window.addEventListener('load', function () {
      hmhRenderTourDatesFromWidget();

      const host = document.getElementById('tourDatesList');
      if (!host) return;

      const observer = new MutationObserver(() => {
        if (hmhRenderTourDatesFromWidget()) {
          observer.disconnect();
        }
      });

      observer.observe(host, { childList: true, subtree: true });

      let tries = 0;
      const interval = setInterval(() => {
        tries += 1;
        const done = hmhRenderTourDatesFromWidget();
        if (done || tries >= 20) clearInterval(interval);
      }, 250);
    });

    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');

        if (targetUrl === '#' || targetUrl === window.location.pathname.split('/').pop()) {
          return;
        }

        const overlay = document.getElementById('transitionOverlay');

        overlay.classList.add('active');

        setTimeout(() => {
          if (targetUrl) {
            window.location.href = targetUrl;
          }
        }, 1500);
      });
    });

    window.addEventListener('load', function () {
      const overlay = document.getElementById('transitionOverlay');
      overlay.classList.add('fade-in');
      setTimeout(() => {
        overlay.classList.remove('active', 'fade-in');
      }, 1500);
    });

    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', function() {
        hamburger.classList.toggle('active');
        navLinks.classList.toggle('active');
      });

      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function() {
          hamburger.classList.remove('active');
          navLinks.classList.remove('active');
        });
      });
    }
  </script>
</body>
