<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Honey I'm Home</title>
  <link rel="icon" href="images/favicon/favicon.ico" sizes="any">
  <link rel="icon" href="images/favicon/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="images/favicon/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="images/favicon/site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="site-page">
  <div class="content">
    <div class="wrap">
      <!-- VHS frame -->
      <div class="vhs" id="vhs">
        <!-- Camcorder frame -->
        <div class="camcorder-frame">
          <div class="frame-border frame-top"></div>
          <div class="frame-border frame-bottom"></div>
          <div class="frame-border frame-left"></div>
          <div class="frame-border frame-right"></div>
        </div>
        
        <!-- Corners (outside camcorder-frame to ensure proper z-index) -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Content -->
        <div class="content" id="pageContent">
          <div class="shop-container">
            <h1 class="shop-title">SHOP</h1>
            <div class="shop-products-list" id="shopProductsList"></div>
          </div>
        </div>

        <!-- Transition Snow Overlay -->
        <div class="transition-overlay" id="transitionOverlay"></div>

        <!-- Ghost -->
        <div class="ghost" aria-hidden="true"></div>

        <!-- Snow band -->
        <div class="snow-band" id="band" aria-hidden="true">
          <div class="grain"></div>
          <div class="tear"></div>
        </div>

        <!-- Navigation -->
        <nav class="main-nav">
          <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div class="nav-links" id="navLinks">
            <a href="index.html" class="nav-link" data-page="home">Home</a>
            <a href="tour.html" class="nav-link" data-page="tour">Tour</a>
            <a href="music.html" class="nav-link" data-page="music">Music</a>
            <a href="shop.html" class="nav-link" data-page="shop">Shop</a>
            <a href="about.html" class="nav-link" data-page="about">About</a>
            <a href="contact.html" class="nav-link" data-page="contact">Contact</a>
          </div>
        </nav>

        <!-- REC Button -->
        <div class="rec-button">
          <div class="rec-indicator"></div>
          <span class="rec-text">REC</span>
        </div>

        <!-- Date display -->
        <div class="date-display" id="dateDisplay"></div>

      </div>
    </div>
  </div>

  <script src="shop-data.js"></script>
  <script>
    function updateDate() {
      const now = new Date();
      const options = {
        month: '2-digit',
        day: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const dateString = now.toLocaleDateString('en-US', options);
      document.getElementById('dateDisplay').textContent = dateString;
    }

    updateDate();
    setInterval(updateDate, 1000);

    function setActiveNavLink() {
      const currentPage = window.location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav-link').forEach(link => {
        const linkPage = link.getAttribute('href');
        if (linkPage === currentPage || (currentPage === '' && linkPage === 'index.html')) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }
    setActiveNavLink();

    function renderBuyAction(product) {
      if (product.soldOut) {
        return '<span class="shop-link shop-link-unavailable">SOLD OUT</span>';
      }
      if (product.buyLink) {
        const label = product.buyLabel || 'BUY NOW';
        return `<a href="${product.buyLink}" target="_blank" rel="noopener noreferrer" class="shop-link">${label}</a>`;
      }
      return '<span class="shop-link shop-link-unavailable">COMING SOON</span>';
    }

    function displayShopProducts() {
      const container = document.getElementById('shopProductsList');

      if (!shopProducts || shopProducts.length === 0) {
        container.innerHTML = '<p class="no-shop-products">Nothing in the shop yet</p>';
        return;
      }

      container.innerHTML = shopProducts.map(product => {
        return `
          <div class="shop-product-item">
            <div class="shop-product-image">
              <img src="${product.image}" alt="${product.title}" />
            </div>
            <div class="shop-product-info">
              <h2 class="shop-product-title">${product.title}</h2>
              ${product.subtitle ? `<p class="shop-product-subtitle">${product.subtitle}</p>` : ''}
              ${product.description ? `<p class="shop-product-description">${product.description}</p>` : ''}
              ${product.price ? `<p class="shop-product-price">${product.price}</p>` : ''}
              ${renderBuyAction(product)}
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('load', function() {
      displayShopProducts();
    });

    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');

        if (targetUrl === '#' || targetUrl === window.location.pathname.split('/').pop()) {
          return;
        }

        const overlay = document.getElementById('transitionOverlay');
        overlay.classList.add('active');

        setTimeout(() => {
          if (targetUrl) {
            window.location.href = targetUrl;
          }
        }, 1500);
      });
    });

    window.addEventListener('load', function () {
      const overlay = document.getElementById('transitionOverlay');
      overlay.classList.add('fade-in');
      setTimeout(() => {
        overlay.classList.remove('active', 'fade-in');
      }, 1500);
    });

    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', function() {
        hamburger.classList.toggle('active');
        navLinks.classList.toggle('active');
      });

      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function() {
          hamburger.classList.remove('active');
          navLinks.classList.remove('active');
        });
      });
    }
  </script>
</body>

</html>
